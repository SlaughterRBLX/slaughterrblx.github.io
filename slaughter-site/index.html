<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLAUGHTER Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column over full-screen rain; menus swap in place, back button walks up */
:root {
  --bg: #07080b;
  --fg: #d9dce3;
  --dim: #6b7080;
  --line: #22252e;
  --hover: #12141a;
  --panel: rgba(7, 8, 11, .78);
  --live: #5fd38a;
  --rain: 160, 170, 190;
  --display: "Pirata One", "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 14px;
  margin: 0; padding-inline: 16px; overflow-x: hidden;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
main {
  position: relative; z-index: 1;
  min-height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px; padding-block: 48px;
  max-width: 360px; margin-inline: auto;
}
h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(48px, 14vw, 72px); line-height: 1; margin: 0;
  letter-spacing: 0.02em; text-align: center;
  text-shadow: 0 2px 18px #000;
}
.crumb {
  font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--dim); min-height: 1.2em; text-align: center; margin-top: -16px;
}
nav { display: flex; flex-direction: column; gap: 10px; width: 100%; }
nav a, nav button {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  width: 100%; box-sizing: border-box; padding: 14px 16px;
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 2px;
  font: 500 13px/1.2 var(--mono); letter-spacing: 0.18em; text-transform: uppercase;
  text-decoration: none; cursor: pointer; text-align: left;
  transition: background .15s, border-color .15s;
}
nav a:hover, nav button:hover, nav a:focus-visible, nav button:focus-visible {
  background: var(--hover); border-color: var(--dim); outline: none;
}
nav .sub { color: var(--dim); font-weight: 400; letter-spacing: 0.08em; font-size: 11px; white-space: nowrap; }
nav .back { border-color: transparent; background: transparent; color: var(--dim); justify-content: center; }
nav .back:hover { border-color: transparent; background: transparent; color: var(--fg); }

/* live dot */
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 0 0 rgba(95, 211, 138, .6); animation: ping 2s infinite; }
.dot.off { background: var(--dim); animation: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(95, 211, 138, .55); } 70% { box-shadow: 0 0 0 7px rgba(95, 211, 138, 0); } 100% { box-shadow: 0 0 0 0 rgba(95, 211, 138, 0); } }
.live-sub { color: var(--live) !important; }

/* game cards */
nav .game { padding: 12px; gap: 14px; justify-content: flex-start; }
.game .gicon { width: 64px; height: 64px; flex: none; border-radius: 10px; background: var(--hover); object-fit: cover; }
.game .ginfo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 7px; }
.game b { font: 500 13px/1.2 var(--mono); letter-spacing: 0.14em; }
.game .ccu { font-size: 12px; letter-spacing: 0.06em; text-transform: none; color: var(--fg); }
.game .ccu .n { font-weight: 500; font-variant-numeric: tabular-nums; transition: color .6s; }
.game .ccu .n.bump { color: var(--live); transition: none; }
.game .peak { font-size: 10px; letter-spacing: 0.16em; color: #e0b85a; }
.game .peak:empty { display: none; }
.game .visits { font-size: 10px; letter-spacing: 0.12em; color: var(--dim); }
.game .arrow { color: var(--dim); font-size: 11px; align-self: flex-start; }
.game.banned .tag { font-size: 10px; letter-spacing: 0.2em; color: #c0606a; }
.updated { font-size: 10px; letter-spacing: 0.12em; color: var(--dim); text-align: center; margin-top: 2px; }

#gifs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#gifs img { position: absolute; border-radius: 4px; opacity: 0; filter: saturate(.85); will-change: transform, opacity; }
#gifs img.on { opacity: var(--gif-op, .45); }
@media (max-width: 700px) { #gifs { --gif-op: .22; } }
#zback {
  position: fixed; left: 0; bottom: 0;
  width: 33vw; max-width: 520px; z-index: 2;
  padding: 0; border: 0; background: none; cursor: pointer;
  transition: transform .2s ease;
}
#zback img { display: block; width: 100%; height: auto; }
#zback:hover, #zback:focus-visible { transform: translateX(-8px); outline: none; }
@media (max-width: 700px) { #zback { display: none; } }
@media (min-width: 701px) { nav .back { display: none; } }

.detail { display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
.detail img { display: block; max-width: 100%; border: 1px solid var(--line); }
.detail .meta { display: flex; gap: 12px; align-items: center; }
.detail .icon { width: 64px; height: 64px; flex: none; }
.detail .meta div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.detail b { font: 500 13px/1.2 var(--mono); letter-spacing: 0.18em; }
.detail .tag { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #c0606a; }
.detail p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--fg); }
.detail figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.detail figcaption { font-size: 11px; line-height: 1.5; color: var(--dim); }
footer { font-size: 11px; color: var(--dim); text-align: center; letter-spacing: 0.08em; }
footer span { color: var(--fg); user-select: all; }
.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: .3; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade, .dot { animation: none; } }
</style>
</head>
<body>

<canvas id="rain" aria-hidden="true"></canvas>
<div id="gifs" aria-hidden="true"></div>
<button id="zback" type="button" aria-label="Back" title="Back" hidden><img src="arrow-guy.png" alt=""></button>
<main>
  <h1>SLAUGHTER</h1>
  <div class="crumb" id="crumb"></div>
  <nav id="menu"></nav>
  <footer>business — <span id="email"></span></footer>
</main>

<script>
// ===== GIFS (GIPHY ids — the part before /giphy.gif in each link) =====
const GIFS = [
  "LwTAKTOg8kMXm", "yyKCipH3YmkKPkuFDg", "teC5BZ98IFdaE", "8L1pCJGYVnbmfs97Ta",
  "pz2MwgsXVocJHQ3k3p", "Lmrmsef9aIjIuXwA95", "qDj2cg2ZR27nqJm65k", "oQgyhvK8hmUogxXI8Z",
  "eRvTDaqVcWXl1WAwGF", "zHuDaJUqrEVvnH3wUb", "wvgeDjaSFMo2xTdejl", "2jvYTTzGWVtP8orPWd",
  "ieVedQqLpuzfTgMWi1", "idktEEeebpok8jtxof", "xsNj7zCD7kwBdtPpK0", "bUIGbo1n3A8YdL7mg5",
  "KwkE2AZihClmSXatzt", "3o72EVSffJnSga9mKI", "todc1pmjkSgK72P8Ar", "JKWHs0sWp547nOB2Ea",
  "SLIW1gVWoJTpvR8Cx4", "4YjATtUu9BYJl8ZJGn", "z7wAuoFCRcz5MVILcL", "ZyNv8IreclMZ1q445D",
  "e1p1VBtku6pdaTgBVd", "Sx5blTgMm0EdN4qWkA"
];

// ===== GAMES (live CCU + icon pulled from Roblox) =====
// universe = universe ID, place = the number in the roblox.com/games/ link
// peak = all-time peak CCU (0 hides it until set). A GitHub Action checks every
// 5 minutes and saves new highs to peaks.json, which the site reads on load.
const GAMES = [
  { name: "Catch Big Bass", universe: 10773353519, place: 74991411879273, peak: 405 },
  { name: "Headtap",        universe: 10194619622, place: 124673719670870, peak: 168 },
];
const REFRESH_SECONDS = 30;

// ===== EDIT YOUR LINKS HERE =====
const EMAIL = "celestialstudios223@gmail.com";
const MENU = {
  title: "",
  items: [
    { label: "Portfolio", games: true, items: [
      { label: "DNAGG", sub: "banned", detail: {
        thumb: "dnagg-thumb.jpg",
        icon: "dnagg-icon.jpg",
        note: "My first real project. Taken down over monetization issues.",
        photo: "dnagg-owner.jpg",
        caption: "Me with Brad3n, owner of the original DAAG. It was in Legacy too.",
      }},
    ]},
    { label: "Education", items: [
      { label: "YouTube Long Form", sub: "free", href: "https://www.youtube.com/@SlaughterRBLX/videos" },
    ]},
    { label: "Social Medias", items: [
      { label: "YouTube", items: [
        { label: "Long Form", sub: "free education", href: "https://www.youtube.com/@SlaughterRBLX/videos" },
        { label: "Short Form", href: "https://www.youtube.com/@SlaughterRBLX/shorts" },
      ]},
      { label: "TikTok",    href: "https://www.tiktok.com/@slaughterblox" },
      { label: "Instagram", href: "https://www.instagram.com/slaughterrblxreal/" },
    ]},
  ],
};
// ================================

const live = {};          // universe -> { playing, visits, icon }
let lastUpdate = null;
const fmt = n => n.toLocaleString("en-US");
const compact = n => new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(n);

const stack = [MENU];
const nav = document.getElementById("menu");
const crumb = document.getElementById("crumb");
const zback = document.getElementById("zback");
document.getElementById("email").textContent = EMAIL;

function gameCard(g) {
  const a = document.createElement("a");
  a.className = "game"; a.href = `https://www.roblox.com/games/${g.place}`;
  a.target = "_blank"; a.rel = "noopener"; a.dataset.u = g.universe;
  a.innerHTML = `<img class="gicon" alt=""><div class="ginfo"><b></b><span class="ccu"><i class="dot off"></i><span class="n">—</span> playing</span><span class="peak"></span><span class="visits"></span></div><span class="arrow">↗</span>`;
  a.querySelector("b").textContent = g.name;
  a.querySelector(".gicon").alt = g.name + " icon";
  a._game = g;
  fillCard(a);
  return a;
}
function fillCard(a) {
  const d = live[a.dataset.u] || {}, g = a._game;
  const peak = Math.max(g?.peak || 0, d.peak || 0, d.playing || 0);
  if (g && g.peak) a.querySelector(".peak").textContent = `PEAKED ${fmt(peak)} CCU`;
  const n = a.querySelector(".n"), icon = a.querySelector(".gicon");
  if (d.icon && icon.src !== d.icon) icon.src = d.icon;
  if (d.playing != null) {
    const txt = fmt(d.playing);
    if (n.textContent !== txt) {
      const changed = n.textContent !== "—";
      n.textContent = txt;
      if (changed) { n.classList.add("bump"); requestAnimationFrame(() => requestAnimationFrame(() => n.classList.remove("bump"))); }
    }
    a.querySelector(".dot").classList.toggle("off", d.playing === 0);
  }
  if (d.visits != null) a.querySelector(".visits").textContent = compact(d.visits) + " visits";
}
function totalLive() {
  const vals = GAMES.map(g => live[g.universe]?.playing).filter(v => v != null);
  return vals.length ? vals.reduce((s, v) => s + v, 0) : null;
}
function refreshLiveBits() {
  nav.querySelectorAll(".game[data-u]").forEach(fillCard);
  const pf = nav.querySelector("[data-portfolio] .sub"), t = totalLive();
  if (pf && t != null) { pf.innerHTML = `<i class="dot"></i>${fmt(t)} live`; pf.classList.add("live-sub"); }
  const up = nav.querySelector(".updated");
  if (up && lastUpdate) up.textContent = `live · updates every ${REFRESH_SECONDS}s`;
}

function render() {
  const cur = stack[stack.length - 1];
  nav.innerHTML = "";
  crumb.textContent = stack.slice(1).map(m => m.label).join(" / ");

  if (cur.detail) {
    const d = cur.detail, box = document.createElement("div");
    box.className = "detail";
    box.innerHTML = `<img class="thumb" alt="DNAGG thumbnail"><div class="meta"><img class="icon" alt="DNAGG icon"><div><b></b><span class="tag">banned</span><p></p></div></div><figure><img alt="Me with the owner of the original DAAG"><figcaption></figcaption></figure>`;
    box.querySelector(".thumb").src = d.thumb;
    box.querySelector(".icon").src = d.icon;
    box.querySelector("b").textContent = cur.label;
    box.querySelector(".meta p").textContent = d.note;
    box.querySelector("figure img").src = d.photo;
    box.querySelector("figcaption").textContent = d.caption;
    nav.appendChild(box);
  }

  if (cur.games) GAMES.forEach(g => nav.appendChild(gameCard(g)));

  (cur.items || []).forEach(it => {
    // banned game with a detail page, shown as a card in the portfolio
    if (cur.games && it.detail) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "game banned";
      b.innerHTML = `<img class="gicon" alt=""><div class="ginfo"><b></b><span class="tag">BANNED</span><span class="visits">first real project</span></div><span class="arrow">+</span>`;
      b.querySelector("b").textContent = it.label;
      b.querySelector(".gicon").src = it.detail.icon;
      b.querySelector(".gicon").alt = it.label + " icon";
      b.onclick = () => { stack.push(it); render(); };
      nav.appendChild(b); return;
    }
    const el = document.createElement(it.items || it.detail || it.games ? "button" : "a");
    if (it.items || it.detail || it.games) {
      el.type = "button";
      el.onclick = () => { stack.push(it); render(); };
    } else {
      el.href = it.href; el.target = "_blank"; el.rel = "noopener";
    }
    el.innerHTML = `<span></span><span class="sub"></span>`;
    el.children[0].textContent = it.label;
    el.children[1].textContent = it.sub || (it.items ? "+" : "↗");
    if (it.games) el.dataset.portfolio = "";
    if (it.detail) el.children[1].style.color = "#c0606a";
    nav.appendChild(el);
  });

  if (cur.games) {
    const up = document.createElement("div"); up.className = "updated";
    up.textContent = "loading live numbers…";
    nav.appendChild(up);
  }

  zback.hidden = stack.length < 2;
  if (stack.length > 1) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "back"; b.textContent = "← back";
    b.onclick = () => { stack.pop(); render(); };
    nav.appendChild(b);
  }
  refreshLiveBits();
  nav.classList.remove("fade"); void nav.offsetWidth; nav.classList.add("fade");
}
zback.onclick = () => { stack.pop(); render(); };
render();

// ===== live CCU =====
// Roblox blocks direct browser requests, so this goes through public mirrors.
// Free mirrors get rate-limited, so it tries each one in turn and keeps the last good numbers.
const MIRRORS = ["rotunnel.com", "roproxy.com"];
let mirror = 0;
async function viaMirror(path) {
  for (let i = 0; i < MIRRORS.length; i++) {
    const host = MIRRORS[(mirror + i) % MIRRORS.length];
    try {
      const r = await fetch(`https://${path.split("/")[0]}.${host}/${path.split("/").slice(1).join("/")}`, { cache: "no-store" });
      if (!r.ok) continue;
      const j = await r.json();
      if (j && Array.isArray(j.data) && j.data.length) { mirror = (mirror + i) % MIRRORS.length; return j.data; }
    } catch (e) {}
  }
  return null;
}
try { Object.assign(live, JSON.parse(localStorage.getItem("slaughter-live") || "{}")); } catch (e) {}
let retry;
async function pullLive(withIcons) {
  const ids = GAMES.map(g => g.universe).join(",");
  clearTimeout(retry);
  const games = await viaMirror(`games/v1/games?universeIds=${ids}`);
  if (games) {
    for (const g of games) {
      const d = live[g.id] ||= {};
      Object.assign(d, { playing: g.playing, visits: g.visits, peak: Math.max(d.peak || 0, g.playing || 0) });
    }
    lastUpdate = Date.now();
  } else {
    retry = setTimeout(() => pullLive(false), 8000);   // a mirror was busy, try again soon
  }
  if (withIcons) {
    const icons = await viaMirror(`thumbnails/v1/games/icons?universeIds=${ids}&size=150x150&format=Png&isCircular=false`);
    for (const t of icons || []) if (t.imageUrl) (live[t.targetId] ||= {}).icon = t.imageUrl;
  }
  try { localStorage.setItem("slaughter-live", JSON.stringify(live)); } catch (e) {}
  refreshLiveBits();
}
pullLive(true);
fetch("peaks.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(p => {
  for (const g of GAMES) if (p[g.universe] > g.peak) g.peak = p[g.universe];
  refreshLiveBits();
}).catch(() => {});
setInterval(() => { if (!document.hidden) pullLive(false); }, REFRESH_SECONDS * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pullLive(false); });

// ===== floating gifs: random spots anywhere on screen, slow random drift =====
(() => {
  const layer = document.getElementById("gifs");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let queue = [];
  const next = () => { if (!queue.length) queue = GIFS.slice().sort(() => Math.random() - .5); return queue.pop(); };
  const slots = innerWidth > 900 ? 7 : 4;
  for (let i = 0; i < slots; i++) {
    const img = document.createElement("img"); img.alt = ""; img.decoding = "async";
    layer.appendChild(img);
    const cycle = () => {
      const W = innerWidth, H = innerHeight;
      const w = Math.round((W > 900 ? 120 : 85) + Math.random() * 100), h = w * .8;
      let x, y;
      for (let t = 0; t < 14; t++) {
        x = Math.random() * Math.max(0, W - w);
        y = Math.random() * Math.max(0, H - h);
        const hit = [...layer.children].some(o => o !== img && o.classList.contains("on") &&
          x < o.offsetLeft + o.offsetWidth + 20 && x + w + 20 > o.offsetLeft &&
          y < o.offsetTop + o.offsetHeight + 20 && y + h + 20 > o.offsetTop);
        if (!hit) break;
      }
      const life = 7000 + Math.random() * 6000;
      img.style.transition = "opacity 1.2s ease";
      img.classList.remove("on");
      setTimeout(() => {
        img.style.transition = "none";
        img.style.transform = "translate(0,0)";
        img.style.left = x + "px"; img.style.top = y + "px"; img.style.width = w + "px";
        img.onload = () => {
          img.style.transition = `opacity 1.2s ease, transform ${life + 1200}ms linear`;
          img.classList.add("on");
          if (!calm) {
            const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
            img.style.transform = `translate(${(Math.cos(a) * d).toFixed(0)}px, ${(Math.sin(a) * d).toFixed(0)}px)`;
          }
        };
        img.src = `https://media.giphy.com/media/${next()}/200w.webp`;
        if (!calm) setTimeout(cycle, life);
      }, 1200);
    };
    setTimeout(cycle, i * 700);
  }
})();

// ===== rain =====
const cv = document.getElementById("rain"), ctx = cv.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rgb = getComputedStyle(document.documentElement).getPropertyValue("--rain").trim();
let drops = [], W, H;
function size() {
  const d = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  drops = Array.from({ length: Math.round(W * H / 9000) }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    l: 8 + Math.random() * 16, v: 6 + Math.random() * 8, a: 0.08 + Math.random() * 0.22,
  }));
}
function frame() {
  ctx.clearRect(0, 0, W, H);
  for (const p of drops) {
    ctx.strokeStyle = `rgba(${rgb},${p.a})`;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.l * 0.12, p.y + p.l); ctx.stroke();
    if (!still) { p.y += p.v; p.x -= p.v * 0.12; if (p.y > H) { p.y = -p.l; p.x = Math.random() * (W + 40); } }
  }
  if (!still) requestAnimationFrame(frame);
}
addEventListener("resize", () => { size(); if (still) frame(); });
size(); frame();
</script>
</body>
</html>
